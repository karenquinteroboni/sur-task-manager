.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}

<header>
  <h1>SUR Task Manager</h1>
  <nav id="nav">
    <button type="button" data-v="dashboard" id="nav-dashboard">Dashboard</button>
    <button type="button" data-v="tablero" id="nav-tablero">Tablero</button>
    <button type="button" data-v="empresas" id="nav-empresas">Empresas</button>
    <button type="button" data-v="procesos" id="nav-procesos">Procesos</button>
  </nav>
  <span class="sp"></span>
  <span class="live" id="live">conectando…</span>

<main id="app"></main>
<datalist id="dl-resp"></datalist>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* Modelo: cada tarea recurrente es una SECUENCIA (colección `secuencias`).
   La fecha elegida por el usuario es el ancla; la periodicidad genera el resto:
   Semanal = mismo día de la semana · Quincenal = cada 14 días · Mensual = mismo día del mes
   (Trimestral = cada 3 meses, Anual = cada año, Única = una sola vez).
   tramos[{desde,ancla}] guardan los cambios de regla ("Toda la secuencia") sin crear otra secuencia;
   ex{fechaOriginal:{d}} guardan los cambios de "Solo este día"; est{fechaOriginal:{e,n,r}} el estado de cada repetición. */
const PER = ["Semanal","Quincenal","Mensual","Trimestral","Anual"], NA = "No aplica", UNICA = "Única";
const ESTADOS = ["Pendiente","En curso","Bloqueada","Hecha"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DOWL = ["","lun","mar","mié","jue","vie","sáb","dom"], DOWF = ["","lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const $ = (s,r=document)=>r.querySelector(s);
const esc = v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o=>JSON.parse(JSON.stringify(o));
const pad = n=>String(n).padStart(2,"0");
const iso = (y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const lastDay = (y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const T = s=>Date.parse(s+"T00:00:00Z");
const addDays = (s,n)=>new Date(T(s)+n*864e5).toISOString().slice(0,10);
const wd = s=>new Date(T(s)).getUTCDay()||7;
const today = (()=>{const n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate())})();
const fmtDue = s=>`${DOWL[wd(s)]} ${s.slice(8)}/${s.slice(5,7)}`;
const fmtFull = s=>`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}`;
const validISO = s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")&&!isNaN(T(s));

/* ---------- motor de recurrencia ---------- */
function addMonthsClamp(anc,n){
  const [y,m,d]=anc.split("-").map(Number), t=(m-1)+n, yy=y+Math.floor(t/12), mm=((t%12)+12)%12+1;
  return iso(yy,mm,Math.min(d,lastDay(yy,mm)));
}
// Fechas de una regla (per + ancla) dentro de [lo,hi]. Mensual conserva el día; si el mes es más corto usa su último día.
function gen(per,anc,lo,hi){
  const out=[]; if(lo>hi) return out;
  if(per===UNICA){ if(anc>=lo&&anc<=hi) out.push(anc); return out }
  if(per==="Semanal"||per==="Quincenal"){
    const st=per==="Semanal"?7:14;
    for(let k=Math.max(0,Math.ceil((T(lo)-T(anc))/(st*864e5)));;k++){const x=addDays(anc,k*st);if(x>hi)break;out.push(x)}
    return out;
  }
  const step=per==="Mensual"?1:per==="Trimestral"?3:12;
  const [ay,am]=anc.split("-").map(Number), [ly,lm]=lo.split("-").map(Number);
  for(let n=Math.max(0,Math.floor(((ly*12+lm)-(ay*12+am))/step)-1);;n++){
    const x=addMonthsClamp(anc,n*step); if(x>hi)break; if(x>=lo)out.push(x);
  }
  return out;
}
const tramosOf=q=>[...(q.tramos||[])].sort((a,b)=>a.desde.localeCompare(b.desde));
function occs(q,per,from,to){
  const tr=tramosOf(q), out=[];
  tr.forEach((t,i)=>{
    const end=tr[i+1]?addDays(tr[i+1].desde,-1):"9999-12-31";
    gen(per,t.ancla,t.desde>from?t.desde:from,end<to?end:to).forEach(x=>out.push(x));
  });
  return out;
}
const anclaAt=(q,occ)=>{const tr=tramosOf(q).filter(t=>t.desde<=occ);return (tr[tr.length-1]||q.tramos[0]).ancla};
function ruleText(per,anc){
  const [,m,d]=anc.split("-").map(Number);
  return per==="Semanal"?`cada ${DOWF[wd(anc)]}`:per==="Quincenal"?"cada 14 días":per==="Mensual"?`día ${d} de cada mes`
    :per==="Trimestral"?`día ${d} cada 3 meses`:per==="Anual"?`cada ${d} de ${MESES[m-1]}`:"una sola vez";
}

/* ---------- estado ---------- */
const S={emp:[],cat:[],seq:[],sort:{k:"",dir:1},sortE:{k:"",dir:1},armDel:null,view:"dashboard",dsec:{venc:true,curso:true,pend:false,bloq:false,hecha:false},ai:{busy:false,text:"",err:""},resumen:null,sample:null,mes:today.slice(0,7),q:"",dirty:false,showPend:false,
  f:{empresa:"",resp:"",proceso:"",per:"",estado:"",ocultar:false,agrupar:true},
  ready:{emp:false,cat:false,seq:false,res:false},canWrite:true,db:null,fail:""};
const perOf=(q,a)=>q.origen==="manual"?q.per:a?.per;

function tareas(mes=S.mes){
  const [y,m]=mes.split("-").map(Number), lo=iso(y,m,1), hi=iso(y,m,lastDay(y,m)), out=[];
  for(const q of S.seq){
    if(!(q.tramos||[]).length) continue;
    const manual=q.origen==="manual", e=S.emp.find(x=>x.id===q.empresa);
    let a=null; if(!manual){ if(!e||e.estado!=="Activo") continue; a=(e.procesos||[]).find(p=>p.p===q.proceso); if(!a||a.per===NA) continue }
    const per=perOf(q,a); if(!per) continue;
    const c=S.cat.find(x=>x.id===q.proceso), nombre=manual?q.nombre:(c?c.nombre:q.proceso);
    const cand=new Set(occs(q,per,addDays(lo,-45),addDays(hi,45)));
    for(const k of Object.keys(q.ex||{})) if(!cand.has(k)&&occs(q,per,k,k).length) cand.add(k);
    for(const occ of cand){
      const eff=q.ex?.[occ]?.d||occ; if(eff<lo||eff>hi) continue;
      const s=q.est?.[occ]||{}, estado=s.e||"Pendiente";
      out.push({id:`${q.id}_${occ}`,q,occ,eff,per,e,a,c,nombre,manual,estado,nota:s.n||"",h:s.h||"",
        resp:s.r||q.resp||a?.resp||"",late:estado!=="Hecha"&&eff<today,orig:occ===tramosOf(q)[0].ancla,
        regla:ruleText(per,eff!==occ&&tramosOf(q).some(x=>x.ancla===eff&&x.desde>occ)?eff:anclaAt(q,occ))});
    }
  }
  return out;
}
// Asignaciones activas empresa×proceso que todavía no tienen fecha de inicio (no generan tareas).
function pendientes(){
  const out=[];
  for(const e of S.emp){ if(e.estado!=="Activo") continue;
    for(const a of e.procesos||[]){ if(a.per===NA) continue;
      const c=S.cat.find(x=>x.id===a.p); if(!c||S.seq.some(q=>q.id===`${e.id}_${a.p}`)) continue;
      out.push({e,a,c}) } }
  return out;
}

/* ---------- utilidades de UI ---------- */
const opts=(arr,sel,blank)=>(blank!==undefined?`<option value="">${esc(blank)}</option>`:"")+arr.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join("");
const uniq=a=>[...new Set(a.filter(Boolean).map(String))].sort((x,y)=>x.localeCompare(y,"es"));
let toastT; function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,6000)}
let chain=Promise.resolve();
const enqueue=fn=>{chain=chain.then(fn).catch(e=>toast("No se pudo guardar: "+(e?.message||e?.code||"error")))};
const dis=()=>S.canWrite?"":" disabled";
function setResp(){
  const names=uniq([...S.emp.flatMap(e=>[e.finanzas,e.contabilidad,...(e.procesos||[]).map(a=>a.resp)]),...S.seq.map(q=>q.resp)]);
  $("#dl-resp").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
}
const loading=()=>!(S.ready.emp&&S.ready.cat&&S.ready.seq);
const sortTh=(sk,k,l)=>{const o=S[sk], on=o.k===k;
  return `<th aria-sort="${on?(o.dir>0?"ascending":"descending"):"none"}"><button type="button" class="sort" data-sk="${sk}" data-sort="${k}" title="Ordenar por ${esc(l)}">${l}${on?(o.dir>0?" ▲":" ▼"):""}</button></th>`};
const shell=inner=>S.fail?`<div class="empty">${esc(S.fail)}</div>`:inner;
const empOpts=sel=>S.emp.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(e=>`<option value="${esc(e.id)}"${sel===e.id?" selected":""}>${esc(e.nombre)}</option>`).join("");
const seqDoc=(o)=>({...o,ex:o.ex||{},est:o.est||{}});
function crearSecuencia(id,o){ enqueue(()=>S.db.doc("secuencias/"+id).set(seqDoc(o))); }

/* ---------- vistas ---------- */
function dayCtl(t){
  const at=`data-day="1" data-sid="${esc(t.q.id)}" data-occ="${t.occ}" id="dy-${esc(t.id)}" aria-label="Día de realización"${dis()}`;
  if(t.per==="Semanal"){
    const mon=addDays(t.eff,-(wd(t.eff)-1)), days=[0,1,2,3,4].map(i=>addDays(mon,i)); if(!days.includes(t.eff)) days.push(t.eff);
    return `<select ${at}>${days.map(x=>`<option value="${x}"${x===t.eff?" selected":""}>${fmtDue(x)}</option>`).join("")}</select>`;
  }
  return `<input type="date" ${at} value="${t.eff}">`;
}

function vTablero(){
  const all=tareas(), f=S.f, [y,m]=S.mes.split("-").map(Number);
  const resps=uniq(all.map(t=>t.resp));
  const ts=all.filter(t=>(!f.empresa||t.q.empresa===f.empresa)&&(!f.proceso||t.q.proceso===f.proceso)&&(!f.per||t.per===f.per)
    &&(!f.resp||t.resp===f.resp)&&(!f.estado||(f.estado==="Vencidas"?t.late:t.estado===f.estado))&&!(f.ocultar&&t.estado==="Hecha"));
  const cnt=s=>all.filter(t=>t.estado===s).length, late=all.filter(t=>t.late).length;
  const pct=all.length?Math.round(cnt("Hecha")/all.length*100):0;

async function generarResumen(){
  if(!S.sample||S.ai.busy) return;
  const d=dashData(), ctl=new AbortController();
  S.ai={busy:true,text:"",err:"",ctl}; render(true);
  const prompt=`Eres analista de operaciones de SUR Consulting, una firma de contabilidad. Redacta para la dirección un resumen ejecutivo, en español, de lo que va del mes.

<datos>${JSON.stringify(aiPayload(d))}</datos>`;
  try{
    const r=await S.sample(prompt,{cache:false,signal:ctl.signal,onText:({text})=>{S.ai.text=text;const el=$("#ai-text");if(el)el.textContent=text}});
    S.ai={busy:false,text:r.text,err:r.truncated?"La respuesta se cortó por longitud.":""};

  render(true);
}

    return `<section class="sec"><button type="button" data-dsec="${k}" aria-expanded="${open}" id="ds-${k}"><span><i class="sw s-${k}"></i>${CLSL[k]==="Vencida"?"Vencidas":CLSL[k]==="Hecha"?"Realizadas":CLSL[k]==="Pendiente"?"Pendientes":CLSL[k]==="Bloqueada"?"Bloqueadas":"En curso"}</span><span>${list.length} ${open?"▴":"▾"}</span></button>
    ${open?`<ul>${list.slice(0,40).map(t=>`<li>${esc(t.nombre)}<span>${esc(ename2(t))} · ${fmtDue(t.eff)}${t.resp?" · "+esc(t.resp):""}</span></li>`).join("")||`<li class="mut">Sin tareas</li>`}${list.length>40?`<li class="mut">y ${list.length-40} más (ver en Tablero)</li>`:""}</ul>`:""}</section>`}).join("");
  return `<div class="bar"><h2>Dashboard · ${MESES[m-1]} ${y}</h2><span class="mut">Hoy: ${fmtDue(today)}</span><span class="sp"></span></div>
  <div class="dash"><div>
    <div class="kpis" style="margin:0">
      ${kp(d.total,"Tareas del mes")}
      ${kp(pc(d.realiz),"Realización",`${c.hecha} de ${d.total} hechas`)}
      ${kp(pc(d.cumpl),"Cumplimiento a la fecha",`de ${d.vencenN} que vencían hasta hoy`)}
      ${kp(pc(d.atiempo),"Hechas a tiempo",d.atiempoN?`de ${d.atiempoN} con fecha registrada`:"aún sin datos")}
      <div class="kpi"><b style="color:${c.venc?"var(--bad)":"inherit"}">${c.venc}</b><span>Vencidas</span></div></div>
    <div class="panel"><h3>Vencidas <small>no hechas con día anterior a hoy · más antiguas primero</small></h3>${taskTable(d.venc,"No hay tareas vencidas este mes.")}
      ${d.venc.length?`<button type="button" data-goven="1" id="go-ven">Ver todas en el Tablero</button>`:""}</div>
    <div class="two">
      <div class="panel"><h3>Hoy <small>${fmtDue(today)} · ${d.hoy.filter(t=>t.estado!=="Hecha").length} por hacer</small></h3>${taskTable(d.hoy,"Sin tareas para hoy.",15,true)}</div>
      <div class="panel"><h3>Siguiente día hábil <small>${fmtDue(d.nd)}</small></h3>${taskTable(d.sig,"Sin tareas para ese día.",15,true)}</div></div>
    <div class="panel"><h3>Cumplimiento por responsable</h3>${legend}${bars(d.porResp)}</div>
    <div class="two">
      <div class="panel"><h3>Por proceso</h3>${bars(d.porProc)}</div>
      <div class="panel"><h3>Empresas con más atraso <small>top 8</small></h3>${bars(d.porEmp)}</div></div>
    ${ai}
  </div><aside class="side panel"><h3>Estado del mes <small>${d.total} tareas</small></h3>${side}
    <p class="note" style="padding:8px 0 0">“Vencida” incluye tareas en curso o bloqueadas con día anterior a hoy; cada tarea cuenta en un solo grupo.</p></aside></div>`;
}

/* ---------- ficha de empresa ---------- */
const CAMPOS=[["nombre","Nombre"],["grupo","Grupo"],["rut","RUT"],["tipo","Tipo"],["complejidad","Complejidad"],["servicio","Servicio"],["finanzas","Finanzas (informativo)"],["contabilidad","Contabilidad (informativo)"],["carga","Carga"]];
function editEmpresa(id){
  const nuevo=id==="new";
  const e=nuevo?{nombre:"",estado:"Activo",tipo:"Regular",procesos:[]}:clone(S.emp.find(x=>x.id===id));
  const dlg=$("#dlg"), docId=nuevo?"e"+Date.now().toString(36):id;
  const row=c=>{const a=(e.procesos||[]).find(p=>p.p===c.id)||{p:c.id,per:nuevo?"Mensual":NA};
    const q=S.seq.find(x=>x.id===`${docId}_${c.id}`);
    return `<div class="prow" data-pid="${esc(c.id)}"><div class="pname">${esc(c.nombre)}</div>
    <select data-r="per" id="pp-${esc(c.id)}" aria-label="Periodicidad de ${esc(c.nombre)}">${opts([...PER,NA],a.per)}</select>
    <div>${q?`<span class="mut">desde ${fmtFull(q.tramos[0].ancla)}</span>`:`<input type="date" data-r="start" id="ps-${esc(c.id)}" aria-label="Fecha de inicio de ${esc(c.nombre)}">`}</div>
    <input data-r="resp" list="dl-resp" id="pr-${esc(c.id)}" aria-label="Responsable de ${esc(c.nombre)}" placeholder="Responsable" value="${esc(a.resp||"")}"></div>`};
  dlg.innerHTML=`<h2>${nuevo?"Nueva empresa":"Editar empresa"}</h2>
  <div class="grid">${CAMPOS.map(([k,l])=>`<label>${l}<input data-k="${k}" id="fe-${k}" list="dl-${k}" value="${esc(e[k])}"></label>`).join("")}
   <label>Estado<select data-k="estado" id="fe-estado">${opts(["Activo","Inactivo"],e.estado)}</select></label></div>
  ${CAMPOS.map(([k])=>`<datalist id="dl-${k}">${uniq(S.emp.map(x=>x[k])).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`).join("")}
  <h2 style="font-size:14px;margin-top:6px">Procesos, periodicidad y responsable</h2>
  <p class="note" style="padding:2px 0 8px">Todos los procesos vienen incluidos. Cambia la periodicidad, o “No aplica”. La fecha de inicio define la regla de repetición; una vez creada, se cambia desde el tablero.</p>
  <div class="hd"><span>Proceso</span><span>Periodicidad</span><span>Fecha de inicio</span><span>Responsable</span></div>
  <div id="procs">${S.cat.map(row).join("")}</div>
  <div class="acts">${nuevo?"":`<button type="button" class="bad" id="delE" style="margin-right:auto"${dis()}>Eliminar empresa</button>`}<button type="button" id="cancel">Cancelar</button><button type="button" class="pri" id="ok"${dis()}>Guardar</button></div>`;
  $("#cancel",dlg).onclick=()=>dlg.close();
  const del=$("#delE",dlg);
  if(del) del.onclick=()=>{
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="¿Seguro? Confirmar eliminación";return}
    enqueue(async()=>{await S.db.doc("empresas/"+id).delete();for(const q of S.seq.filter(x=>x.empresa===id))await S.db.doc("secuencias/"+q.id).delete()});
    dlg.close();
  };
  $("#ok",dlg).onclick=()=>{
    dlg.querySelectorAll("[data-k]").forEach(i=>e[i.dataset.k]=i.value.trim());
    if(!e.nombre) return toast("El nombre es obligatorio.");
    e.carga=Number(e.carga)||0;
    const starts=[];
    e.procesos=[...dlg.querySelectorAll(".prow")].map(r=>{
      const per=$("[data-r=per]",r).value, a={p:r.dataset.pid,per}, resp=$("[data-r=resp]",r).value.trim(), st=$("[data-r=start]",r)?.value;
      if(resp) a.resp=resp;
      if(per!==NA&&validISO(st)) starts.push([r.dataset.pid,st]);
      return a;
    });
    enqueue(async()=>{
      await S.db.doc("empresas/"+docId).set(e);
      for(const [pid,st] of starts) await S.db.doc(`secuencias/${docId}_${pid}`).set(seqDoc({origen:"proceso",empresa:docId,proceso:pid,tramos:[{desde:st,ancla:st}]}));
    });
    dlg.close();
  };
  dlg.showModal();
}

/* ---------- nuevo proceso (catálogo) ---------- */
function nuevoProceso(){
  const dlg=$("#dlg"), es=S.emp.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  dlg.innerHTML=`<h2>Nuevo proceso</h2>
  <div class="grid">
    <label style="grid-column:1/-1">Nombre del proceso *<input id="np-nombre" autocomplete="off"></label>
    <label>Periodicidad *<select id="np-per">${opts(PER,"Mensual")}</select></label>
    <label>Fecha de inicio<input type="date" id="np-fecha"></label>
    <label>Responsable<input id="np-resp" list="dl-resp" autocomplete="off"></label></div>
  <h2 style="font-size:14px">¿A qué empresas se aplica?</h2>
  <label class="chk"><input type="radio" name="np-alc" id="np-todas" checked> Todas las empresas (${es.length})</label>
  <label class="chk"><input type="radio" name="np-alc" id="np-sel"> Solo las que seleccione</label>
  <div id="np-box" hidden>
    <div class="bar" style="margin:6px 0"><input id="np-q" placeholder="Buscar empresa…" aria-label="Buscar empresa"><button type="button" id="np-all">Marcar visibles</button><button type="button" id="np-none">Ninguna</button></div>
    <div class="chklist">${es.map(e=>`<label class="chk" data-name="${esc(e.nombre.toLowerCase())}"><input type="checkbox" data-np="${esc(e.id)}"> ${esc(e.nombre)}${e.grupo?` <span class="mut">· ${esc(e.grupo)}</span>`:""}</label>`).join("")}</div></div>
  <p class="note" id="np-prev" style="padding:8px 0 0"></p>
  <div class="acts"><button type="button" id="cancel">Cancelar</button><button type="button" class="pri" id="ok"${dis()}>Crear proceso</button></div>`;
  const ids=()=>$("#np-todas",dlg).checked?es.map(e=>e.id):[...dlg.querySelectorAll("[data-np]:checked")].map(x=>x.dataset.np);
  const prev=()=>{
    $("#np-box",dlg).hidden=$("#np-todas",dlg).checked;
    const n=ids().length, per=$("#np-per",dlg).value, f=$("#np-fecha",dlg).value;
    $("#np-prev",dlg).textContent=`Se agregará a ${n} ${n===1?"empresa":"empresas"} con periodicidad ${per.toLowerCase()}. `+(validISO(f)?`Regla: ${ruleText(per,f)}, desde ${fmtFull(f)}.`:"Sin fecha de inicio: quedará en «procesos sin fecha de inicio» hasta que la elijas.");
  };
  dlg.oninput=dlg.onchange=prev; prev();
  $("#np-q",dlg).oninput=ev=>{const q=ev.target.value.toLowerCase();dlg.querySelectorAll(".chklist .chk").forEach(l=>l.hidden=!l.dataset.name.includes(q))};
  $("#np-all",dlg).onclick=()=>{dlg.querySelectorAll(".chklist .chk:not([hidden]) input").forEach(x=>x.checked=true);prev()};
  $("#np-none",dlg).onclick=()=>{dlg.querySelectorAll("[data-np]").forEach(x=>x.checked=false);prev()};
  $("#cancel",dlg).onclick=()=>dlg.close();
  $("#ok",dlg).onclick=()=>{
    const nombre=$("#np-nombre",dlg).value.trim(), per=$("#np-per",dlg).value, fecha=$("#np-fecha",dlg).value, resp=$("#np-resp",dlg).value.trim(), sel=ids();
    if(!nombre) return toast("Escribe el nombre del proceso.");
    if(S.cat.some(c=>c.nombre.toLowerCase()===nombre.toLowerCase())) return toast("Ya existe un proceso con ese nombre.");
    if(!sel.length) return toast("Selecciona al menos una empresa.");
    const pid="p"+Date.now().toString(36);
    enqueue(async()=>{
      await S.db.doc("config/catalogo").set({items:[...S.cat,{id:pid,nombre}]});
      for(const id of sel){
        const e=S.emp.find(x=>x.id===id); if(!e) continue;
        const a={p:pid,per}; if(resp) a.resp=resp;
        await S.db.doc("empresas/"+id).update({procesos:[...(e.procesos||[]),a]});
        if(validISO(fecha)) await S.db.doc(`secuencias/${id}_${pid}`).set(seqDoc({origen:"proceso",empresa:id,proceso:pid,tramos:[{desde:fecha,ancla:fecha}]}));
      }
      toast(`Proceso «${nombre}» creado en ${sel.length} ${sel.length===1?"empresa":"empresas"}.`);
    });
    dlg.close();
  };
  dlg.showModal();
}
function eliminarProceso(pid){
  enqueue(async()=>{
    await S.db.doc("config/catalogo").set({items:S.cat.filter(x=>x.id!==pid)});
    for(const e of S.emp) if((e.procesos||[]).some(a=>a.p===pid)) await S.db.doc("empresas/"+e.id).update({procesos:e.procesos.filter(a=>a.p!==pid)});
    for(const q of S.seq) if(q.proceso===pid) await S.db.doc("secuencias/"+q.id).delete();
  });
}

/* ---------- cambio de fecha: solo este día / toda la secuencia ---------- */
function moveSolo(q,occ,nd){ enqueue(()=>S.db.doc("secuencias/"+q.id).update({ex:{[occ]:{d:nd}}})); }
function moveToda(q,per,occ,nd){
  const list=occs(q,per,addDays(occ,-800),addDays(occ,800)).sort(), i=list.indexOf(occ);
  const prev=list[i-1], next=list[i+1];
  if((prev&&nd<=prev)||(next&&nd>=next)){
    toast(`Con “Toda la secuencia” la nueva fecha debe quedar entre la repetición anterior (${prev?fmtFull(prev):"—"}) y la siguiente (${next?fmtFull(next):"—"}). Para moverla más lejos usa “Solo este día”.`);
    return false;
  }
  const desde=addDays(nd>occ?nd:occ,1);
  const tramos=tramosOf(q).filter(t=>t.desde<desde).concat([{desde,ancla:nd}]);
  enqueue(()=>S.db.doc("secuencias/"+q.id).update({tramos,ex:{[occ]:{d:nd}}}));
  return true;
}
function preguntarCambio(sid,occ,nd){
  const q=S.seq.find(x=>x.id===sid); if(!q||!validISO(nd)){render(true);return}
  const t=tareas().find(x=>x.q.id===sid&&x.occ===occ); if(!t||t.eff===nd){render(true);return}
  if(t.per===UNICA){moveSolo(q,occ,nd);return}
  const dlg=$("#dlg2");
  dlg.innerHTML=`<h2>¿Qué deseas modificar?</h2>
  <p><b>${esc(t.nombre)}</b> · ${esc(t.e?.nombre||"")}<br>Cambiar del <b>${fmtDue(t.eff)}</b> (${fmtFull(t.eff)}) al <b>${fmtDue(nd)}</b> (${fmtFull(nd)}).</p>
  <div class="choice"><button type="button" class="pri" id="c-solo">Solo este día</button><small>Mueve únicamente esta tarea. Las demás repeticiones siguen ${esc(t.regla)}.</small></div>
  <div class="choice"><button type="button" id="c-todo">Toda la secuencia</button><small>La nueva fecha es la regla desde ahora: ${esc(ruleText(t.per,nd))}. Cambian las repeticiones futuras; las anteriores no.</small></div>
  <div class="acts"><button type="button" id="c-cancel">Cancelar</button></div>`;
  let done=false; const fin=()=>{done=true;dlg.close()};
  $("#c-solo",dlg).onclick=()=>{moveSolo(q,occ,nd);fin()};
  $("#c-todo",dlg).onclick=()=>{if(moveToda(q,t.per,occ,nd))fin();else{fin();render(true)}};
  $("#c-cancel",dlg).onclick=()=>{fin();render(true)};
  dlg.onclose=()=>{if(!done)render(true)};
  dlg.showModal();
}

/* ---------- detalle de secuencia ---------- */
function detalle(sid,occ){
  const q=S.seq.find(x=>x.id===sid); if(!q) return;
  const t=tareas().find(x=>x.q.id===sid&&x.occ===occ)||{}; const per=t.per||q.per||"";
  const e=S.emp.find(x=>x.id===q.empresa), c=S.cat.find(x=>x.id===q.proceso), dlg=$("#dlg2");
  const tr=tramosOf(q), n=Object.keys(q.ex||{}).length;
  dlg.innerHTML=`<h2>${esc(t.nombre||q.nombre||c?.nombre||"Secuencia")}</h2>
  <dl class="det"><dt>Empresa</dt><dd>${esc(e?.nombre||"—")}</dd><dt>Proceso</dt><dd>${esc(c?.nombre||"—")}</dd>
  <dt>Periodicidad</dt><dd>${esc(per)}</dd><dt>Id de secuencia</dt><dd class="mono">${esc(q.id)}</dd>
  <dt>Tarea original</dt><dd>${fmtFull(tr[0].ancla)} (${DOWF[wd(tr[0].ancla)]})</dd>
  <dt>Reglas</dt><dd>${tr.map(x=>`desde ${fmtFull(x.desde)}: ${esc(ruleText(per,x.ancla))}`).join("<br>")}</dd>
  <dt>Días movidos</dt><dd>${n} ${n===1?"tarea":"tareas"} (solo ese día)</dd></dl>
  <div class="acts"><button type="button" class="bad" id="delS" style="margin-right:auto"${dis()}>${q.origen==="manual"?"Eliminar secuencia":"Quitar fecha de inicio"}</button><button type="button" id="c-cancel">Cerrar</button></div>`;
  $("#c-cancel",dlg).onclick=()=>dlg.close();
  const b=$("#delS",dlg);
  b.onclick=()=>{
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="¿Seguro? Se pierde el estado de todas sus tareas";return}
    enqueue(()=>S.db.doc("secuencias/"+sid).delete()); dlg.close();
  };
  dlg.onclose=null; dlg.showModal();
}

/* ---------- render y eventos ---------- */
function render(force){
  const a=document.activeElement;
  if(!force&&a&&$("#app").contains(a)&&a.matches("input:not([type=checkbox])")){S.dirty=true;return}
  S.dirty=false;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  const ro=S.canWrite?"":`<div class="ro">Solo lectura: tu acceso no permite editar. Pide permiso de Colaborador al dueño.</div>`;
  $("#app").innerHTML=shell(ro+{dashboard:vDashboard,tablero:vTablero,empresas:vEmpresas,procesos:vProcesos}[S.view]());
  setResp();
}
document.addEventListener("focusout",()=>{if(S.dirty)setTimeout(()=>render(),0)});
$("#nav").onclick=e=>{if(e.target.dataset.v){S.view=e.target.dataset.v;render(true)}};

const patchEst=(sid,occ,patch)=>{ if(S.db) enqueue(()=>S.db.doc("secuencias/"+sid).update({est:{[occ]:patch}})) };
function aplicarFecha(pid,fecha){
  const list=pendientes().filter(p=>p.c.id===pid); if(!validISO(fecha)) return toast("Elige una fecha de inicio.");
  for(const p of list) crearSecuencia(`${p.e.id}_${pid}`,{origen:"proceso",empresa:p.e.id,proceso:pid,tramos:[{desde:fecha,ancla:fecha}]});
  toast(`Fecha de inicio aplicada a ${list.length} empresas.`);
}
const app=$("#app");
app.addEventListener("change",e=>{
  const t=e.target,d=t.dataset;
  if(d.day) preguntarCambio(d.sid,d.occ,t.value);
  else if(d.est) patchEst(d.sid,d.occ,{e:t.value,h:t.value==="Hecha"?today:""});
  else if(d.resp){const v=t.value.trim();patchEst(d.sid,d.occ,{r:v===d.def?"":v})}
  else if(d.nota) patchEst(d.sid,d.occ,{n:t.value});
  else if(d.start){ if(validISO(t.value)) crearSecuencia(`${d.eid}_${d.pid}`,{origen:"proceso",empresa:d.eid,proceso:d.pid,tramos:[{desde:t.value,ancla:t.value}]}) }
  else if(d.f){S.f[d.f]=t.value;render(true)}
  else if(d.c){S.f[d.c]=t.checked;render(true)}
});
app.addEventListener("input",e=>{
  if(e.target.id==="q"){S.q=e.target.value;const p=e.target.selectionStart;render(true);const q=$("#q");q.focus();q.setSelectionRange(p,p)}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(S.armDel&&!b.dataset.delp) S.armDel=null;
  if(b.dataset.newp) nuevoProceso();
  else if(b.dataset.delp){ if(S.armDel!==b.dataset.delp){S.armDel=b.dataset.delp;render(true)} else {eliminarProceso(b.dataset.delp);S.armDel=null;render(true)} }
  else if(b.dataset.dsec){S.dsec[b.dataset.dsec]=!S.dsec[b.dataset.dsec];render(true)}
  else if(b.dataset.ai==="gen") generarResumen();
  else if(b.dataset.ai==="stop") S.ai.ctl?.abort();
  else if(b.dataset.goven){S.f={...S.f,estado:"Vencidas",empresa:"",resp:"",proceso:"",per:""};S.mes=today.slice(0,7);S.view="tablero";render(true)}
  else if(b.dataset.sort){
    const o=S[b.dataset.sk], k=b.dataset.sort;
    if(o.k!==k){o.k=k;o.dir=1} else if(o.dir===1) o.dir=-1; else {o.k="";o.dir=1}
    render(true);
  } else if(b.dataset.mes!==undefined){
    const n=Number(b.dataset.mes), [y,m]=S.mes.split("-").map(Number);
    S.mes=n===0?today.slice(0,7):new Date(Date.UTC(y,m-1+n,1)).toISOString().slice(0,7); render(true);
  } else if(b.dataset.edit) editEmpresa(b.dataset.edit);
  else if(b.dataset.det) detalle(b.dataset.det,b.dataset.occ);
  else if(b.dataset.pend){S.showPend=!S.showPend;render(true)}
  else if(b.dataset.apply) aplicarFecha(b.dataset.apply,$("#ap-"+b.dataset.apply).value);
});

/* ---------- datos compartidos ---------- */
render(true);
(async()=>{
  const live=$("#live");
  try{
    const c=window.claude; if(!c?.use) throw 0;
    const [db,user,sample]=await Promise.all([c.use("db"),c.use("user"),c.use("sample").catch(()=>null)]);
    S.sample=sample||null;
    if(!db) throw 0;
    S.db=db;
    if(user&&user.can){try{S.canWrite=(await user.can("data.write"))!==false}catch(e){}}
    const onErr=err=>{S.fail="No se pudieron leer los datos ("+err.code+").";live.textContent="sin conexión";render(true)};
    db.collection("empresas").onSnapshot(s=>{S.emp=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.emp=true;live.textContent="en vivo";live.className="live ok";render()},onErr);
    db.doc("config/catalogo").onSnapshot(s=>{S.cat=s.exists?(s.data().items||[]):[];S.ready.cat=true;render()},onErr);
    db.doc("config/resumen").onSnapshot(s=>{S.resumen=s.exists?s.data():null;S.ready.res=true;render()},()=>{S.ready.res=true});
    db.collection("secuencias").onSnapshot(s=>{S.seq=s.docs.map(d=>({id:d.id,...d.data()}));S.ready.seq=true;render()},onErr);
  }catch(e){if(e)console.error(e);S.fail="Este visor no tiene acceso a los datos compartidos. Abre el artifact desde claude.ai.";live.textContent="sin datos";render(true)}
})();
</script>
